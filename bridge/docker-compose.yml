services:
  ros1_bridge:
    build: .
    image: lang_sam_ros1_bridge:latest
    # --bridge-all-topics(Dockerfileの既定CMD)だと/usb_cam/image_raw等の生画像まで全て転送して
    # 回線を圧迫するため、反対側に購読者がいるトピックだけをブリッジする
    command: ["ros2", "run", "ros1_bridge", "dynamic_bridge"]
    # ROS1のTCPROS(roscore探索)とROS2のDDSマルチキャスト探索の両方が必要なため、
    # コンテナのネットワークをホストと共有する
    network_mode: host
    # Fast-DDSの共有メモリ(SHM)トランスポートを使わせるため、IPC名前空間もホストと共有する
    # (Dockerfile内でFASTDDS_BUILTIN_TRANSPORTS=UDPv4によりSHM自体は無効化済みのため
    #  必須ではないが、他のRMW実装に切り替えた場合の保険として付けている)
    ipc: host
    # ROS1ノードがROS_IP/ROS_HOSTNAME未設定だと自身をOSのホスト名で他ノードに広告するため、
    # コンテナ側でそのホスト名を解決できないとTCPROS接続(実データ転送)に失敗する
    # ("couldn't resolve publisher host [xxx]" エラー)。ROS1ホスト側の全ターミナルで
    # ROS_IP/ROS_HOSTNAMEを設定するのが根本対策だが、保険としてここでも名前解決を教えておく。
    extra_hosts:
      - "${ROS1_HOSTNAME:-ros1-host}:${ROS1_HOST_IP:-127.0.0.1}"
    environment:
      # ロボット側PCでroscoreを動かす場合はそのURLを指定
      - ROS_MASTER_URI=${ROS_MASTER_URI:-http://localhost:11311}
      # このホスト(検出PC)のIP。ROS1ノードからの接続待受に使われる
      - ROS_IP=${ROS_IP}
      # 検出側(ROS2)ノードと共通のドメインID
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    restart: unless-stopped
